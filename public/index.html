<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pathao Courier — Invoices</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🧾</span>
        <div>
          <h1>Pathao Courier Invoices</h1>
          <p class="brand-sub" id="baseUrl">connecting…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="syncBtn" class="btn btn-primary">Sync from Pathao</button>
      </div>
    </header>

    <main>
      <section class="stats" id="stats" aria-label="Totals"></section>

      <div id="syncNotice" class="notice" hidden></div>

      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="invoices" role="tab">Invoices</button>
        <button class="tab" data-tab="unbilled" role="tab">Awaiting invoice</button>
        <button class="tab" data-tab="orders" role="tab">All orders</button>
      </nav>

      <div class="toolbar">
        <input
          id="search"
          class="input"
          type="search"
          placeholder="Search invoice id, consignment, order id, recipient…"
          autocomplete="off"
        />
        <button id="importAllBtn" class="btn">Import all from Pathao</button>
        <button id="importBtn" class="btn">Track a consignment</button>
      </div>

      <section id="panel" class="panel" aria-live="polite"></section>
    </main>

    <div id="drawer" class="drawer" hidden>
      <div class="drawer-backdrop" data-close></div>
      <aside class="drawer-body" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <header class="drawer-head">
          <h2 id="drawerTitle">Invoice</h2>
          <button class="btn btn-icon" data-close aria-label="Close">✕</button>
        </header>
        <div id="drawerContent"></div>
      </aside>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
